<section class="hero">
  <h2>Bem-vindo ao GameHub</h2>
  <p>A plataforma definitiva para explorar, descobrir e cadastrar seus jogos favoritos.</p>
  <a routerLink="/jogos" class="btn-cta">Explorar Catálogo</a>
</section>

<section class="indicadores">
  <div class="card-indicador">
    <h3>{{ totalJogos }}</h3>
    <p>Jogos cadastrados</p>
  </div>
  <div class="card-indicador">
    <h3>{{ totalGratuitos }}</h3>
    <p>Jogos gratuitos</p>
  </div>
</section>

<section class="destaques">
  <h2>Destaques</h2>
  <div class="grid">
    @for (jogo of destaques; track jogo.id) {
      <app-jogo-card [jogo]="jogo"></app-jogo-card>
    }
  </div>
</section>
